<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WayoBoost - TikTok Growth</title>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background: url('YOUR-FLYER-IMAGE.jpg') no-repeat center/cover;
    }
    .overlay {
      background: rgba(0,0,0,0.7);
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 { font-size: 2.8rem; }
    .price { font-size: 2rem; color: yellow; }
    .card {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 15px;
      margin: 20px auto;
      max-width: 400px;
    }
    .btn {
      display: block;
      margin: 10px auto;
      padding: 15px;
      font-size: 1.1rem;
      border-radius: 10px;
      text-decoration: none;
      width: 80%;
      border: none;
      cursor: pointer;
    }
    .pay { background: #00c3f7; color: white; }
    .whatsapp { background: #25D366; }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>🚀 WayoBoost</h1>
    <h2>Get 1,000 TikTok Likes</h2>
    <p class="price">Only GH¢60</p><div class="card">
  <h3>Enter Details</h3>
  <input type="text" id="username" placeholder="TikTok Username" required>
  <input type="email" id="email" placeholder="Your Email" required>
  <button class="btn pay" onclick="payWithPaystack()">Pay Now</button>
  <a href="https://wa.me/0597812169" class="btn whatsapp">Chat on WhatsApp</a>
</div>

  </div>  <script>
    function payWithPaystack() {
      let username = document.getElementById('username').value;
      let email = document.getElementById('email').value;

      if (!username || !email) {
        alert('Please fill all fields');
        return;
      }

      let handler = PaystackPop.setup({
        key: '',
        email: email,
        amount: 6000, // 60 GHS in pesewas
        currency: 'GHS',
        metadata: {
          custom_fields: [
            {
              display_name: "TikTok Username",
              variable_name: "tiktok_username",
              value: username
            }
          ]
        },
        callback: function(response) {
          alert('Payment successful! Order processing...');

          // SEND ORDER TO YOUR BACKEND / SMM PANEL
          fetch('https://your-backend-api.com/order', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              username: username,
              paymentRef: response.reference
            })
          });
        },
        onClose: function() {
          alert('Transaction cancelled');
        }
      });
      handler.openIframe();
    }
  </script></body>
</html>
