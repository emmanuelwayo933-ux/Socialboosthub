<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok Likes — Promo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#070707;
      --panel:#0b0b0b;
      --purple:#7a1cff; /* main purple */
      --accent:#b66bff;
      --white:#ffffff;
      --muted:#cfcfcf;
      --glass: rgba(255,255,255,0.03);
    }

    html,body{
      height:100%;
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background: radial-gradient(1200px 600px at 50% 10%, rgba(122,28,255,0.06), transparent 8%),
                  linear-gradient(180deg,#020202 0%, #070707 100%);
      color:var(--white);
    }

    /* center layout */
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 24px;
      box-sizing:border-box;
    }

    /* virtual browser frame */
    .frame {
      width:100%;
      max-width:520px;
      border-radius:14px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow:
        0 10px 40px rgba(0,0,0,0.7),
        0 0 40px rgba(122,28,255,0.12);
      position:relative;
      padding:22px;
      box-sizing:border-box;
      outline: none;
    }

    /* neon border */
    .frame::before{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:18px;
      z-index:-1;
      background: linear-gradient(90deg, rgba(122,28,255,0.14), rgba(182,107,255,0.08));
      filter: blur(18px);
      opacity:0.95;
    }

    /* window chrome */
    .chrome{
      height:34px;
      display:flex;
      align-items:center;
      gap:8px;
      padding-left:8px;
      margin-bottom:14px;
    }
    .dot{ width:12px; height:12px; border-radius:50%; box-shadow: 0 0 0 2px rgba(255,255,255,0.02) inset;}
    .dot.red{ background:#ff5f57; }
    .dot.yellow{ background:#ffbd2e; }
    .dot.green{ background:#28c840; }

    /* content layout */
    .content{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:18px;
      padding:22px 14px 28px;
      border-radius:8px;
      background:linear-gradient(180deg, rgba(255,255,255,0.004), transparent 30%);
      box-sizing:border-box;
      position:relative;
    }

    /* stylized note icon (not exact brand) */
    .icon {
      width:86px;
      height:86px;
      display:block;
      margin:0 auto;
      position:relative;
    }
    .note {
      width:100%;
      height:100%;
      display:block;
    }

    h1{
      margin:0;
      font-size:28px;
      letter-spacing:0.6px;
      color:var(--purple);
      font-weight:800;
    }

    .price{
      font-size:44px;
      font-weight:800;
      color:var(--white);
      letter-spacing:1px;
    }

    .contact-row{
      display:flex;
      gap:14px;
      align-items:center;
      margin-top:6px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .btn {
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      color:var(--white);
      border:1px solid rgba(255,255,255,0.04);
      text-decoration:none;
      font-weight:600;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease;
      box-shadow: 0 6px 18px rgba(122,28,255,0.06);
    }
    .btn:focus { outline:3px solid rgba(122,28,255,0.14); outline-offset:3px; }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(122,28,255,0.14); }

    .whatsapp {
      background: linear-gradient(90deg, rgba(122,28,255,0.06), rgba(182,107,255,0.04));
      border:1px solid rgba(122,28,255,0.14);
    }

    .phone {
      background: transparent;
    }

    .muted {
      color:var(--muted);
      font-size:14px;
    }

    /* interactive likes counter */
    .counter {
      display:flex;
      gap:10px;
      align-items:center;
      background:var(--glass);
      padding:10px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.02);
    }
    .likes-number { font-weight:800; color:var(--purple); font-size:20px; letter-spacing:0.6px;}
    .likes-label { color:var(--muted); font-weight:600; font-size:13px;}

    /* order modal */
    .modal-backdrop{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(1,1,1,0.6);
      z-index:60;
    }
    .modal {
      width:92%;
      max-width:420px;
      background:linear-gradient(180deg, #0d0d0d, #0a0a0a);
      border-radius:12px;
      padding:20px;
      box-shadow:0 20px 60px rgba(0,0,0,0.7);
      border:1px solid rgba(122,28,255,0.08);
      text-align:left;
    }
    .modal h2 { margin:0 0 8px 0; color:var(--purple); }
    .modal p { margin:0 0 16px 0; color:var(--muted);}
    .modal .actions { display:flex; gap:12px; justify-content:flex-end; }
    .modal .actions .btn { padding:8px 12px; font-weight:700; }

    /* small screens */
    @media (max-width:420px){
      .price { font-size:36px; }
      h1 { font-size:22px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="frame" role="region" aria-label="Promotional ad for TikTok likes" tabindex="0">
      <div class="chrome" aria-hidden="true">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>

      <section class="content" aria-labelledby="promo-title">
        <!-- stylized note (SVG) -->
        <svg class="icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <!-- simple abstract note shape (purple) -->
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b35ff"/>
              <stop offset="1" stop-color="#7a1cff"/>
            </linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g transform="translate(10,6)" filter="url(#glow)">
            <path d="M20 40 C20 20, 40 14, 50 14 L50 50 C60 50, 70 54, 70 64 C70 76, 60 86, 48 86 C36 86, 26 76, 26 64 C26 54,34 50,44 50 L44 22" fill="none" stroke="url(#g1)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="50" cy="74" r="10" fill="url(#g1)"/>
          </g>
        </svg>

        <h1 id="promo-title">GET 1,000 TIKTOK LIKES</h1>

        <div class="price" aria-hidden="false">GH₵60</div>

        <div class="counter" aria-live="polite" aria-atomic="true" title="Animated likes preview">
          <div class="likes-number" id="likes">0</div>
          <div class="likes-label">likes</div>
          <div style="width:8px"></div>
          <button class="btn" id="boostBtn" aria-controls="likes" title="Animate likes">Preview boost</button>
        </div>

        <div class="contact-row" role="group" aria-label="Contact and purchase options">
          <a class="btn phone" href="tel:+233597812169" aria-label="Call 0597812169">
            <!-- phone icon (inline) -->
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.86 19.86 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12 1.1.47 2.17 1.05 3.13a2 2 0 0 1-.45 2.11L9.91 10.91a16 16 0 0 0 6 6l1.95-1.95a2 2 0 0 1 2.11-.45c.96.58 2.03.93 3.13 1.05A2 2 0 0 1 22 16.92z"></path></svg>
            <span>0597812169</span>
          </a>

          <a class="btn whatsapp" href="https://wa.me/2330597812169" target="_blank" rel="noopener noreferrer" aria-label="Open WhatsApp chat" id="waLink">
            <!-- whatsapp icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21.7 2.3A11 11 0 0 0 2.3 21.7L2 22l2.6-.7A11 11 0 0 0 21.7 2.3z"></path><path d="M17 14.5c-.4 1.2-2.2 2.4-3.2 2.6-.9.2-1-.1-1.9-.8s-2.1-2-3.4-3.5c-1.3-1.5.4-1.4 1.5-2.1.6-.4.9-.3 1.2-.2.3.1.7.1.9.1.3 0 .6-.1.9.1.2.1.4.4.6.6.2.2.4.4.6.5.6.3 1.2.8 1.7 1.9.4.9.4 1.8.1 2.6z"></path></svg>
            <span>Chat on WhatsApp</span>
          </a>

          <button class="btn" id="orderBtn" aria-haspopup="dialog" aria-controls="orderModal">Order Now</button>
        </div>

        <p class="muted" style="margin-top:6px">Secure checkout and delivery within 5 minutes after payment confirmation.</p>
      </section>
    </main>
  </div>

  <!-- modal -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document" id="orderModal" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Confirm Order</h2>
      <p>You're ordering <strong>1,000 TikTok likes</strong> for <strong>GH₵60</strong>. Proceed to WhatsApp to complete payment and provide the TikTok post link.</p>
      <div class="actions">
        <button class="btn" id="cancelBtn">Cancel</button>
        <a class="btn whatsapp" id="confirmBtn" href="https://wa.me/2330597812169?text=Hi%20I%20want%201000%20TikTok%20likes%20(Price%20GH%C2%A260).%20My%20post%20link:%20" target="_blank" rel="noopener noreferrer">Open WhatsApp</a>
      </div>
    </div>
  </div>

  <script>
    // likes counter animation
    const likesEl = document.getElementById('likes');
    const boostBtn = document.getElementById('boostBtn');
    let animRunning = false;

    function animateLikes(target = 1000, duration = 1300) {
      if (animRunning) return;
      animRunning = true;
      const start = performance.now();
      const from = 0;
      const to = target;
      function step(now){
        const t = Math.min(1, (now - start) / duration);
        // easeOutCubic
        const v = 1 - Math.pow(1 - t, 3);
        likesEl.textContent = Math.floor(from + (to - from) * v).toLocaleString();
        if (t < 1) requestAnimationFrame(step);
        else { animRunning = false; }
      }
      requestAnimationFrame(step);
    }

    boostBtn.addEventListener('click', () => animateLikes(1000, 1200));

    // modal open/close
    const orderBtn = document.getElementById('orderBtn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const cancelBtn = document.getElementById('cancelBtn');

    function openModal(){
      modalBackdrop.style.display = 'flex';
      modalBackdrop.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
      // focus confirm button
      document.getElementById('confirmBtn').focus();
    }

    function closeModal(){
      modalBackdrop.style.display = 'none';
      modalBackdrop.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
      orderBtn.focus();
    }

    orderBtn.addEventListener('click', openModal);
    cancelBtn.addEventListener('click', closeModal);

    // close when clicking backdrop outside modal content
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    // escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalBackdrop.style.display === 'flex') closeModal();
    });

    // Small accessibility: ensure wa.me link has your intended number (already set)
    const waLink = document.getElementById('waLink');
    waLink.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') waLink.click();
    });

    // initial likes placeholder
    likesEl.textContent = '—';
  </script>
</body>
</html>
